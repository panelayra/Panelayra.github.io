<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayra</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <header id="tab-bar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" width="26" height="26">
          <defs>
            <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#666"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#lg)" opacity="0.12"/>
          <path d="M8 22V10l8 7 8-7v12" fill="none" stroke="#e7e9ea" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="2.8" fill="#e7e9ea"/>
        </svg>
        <span>Ayra</span>
      </div>
      <div id="tabs-container"></div>
      <button id="new-tab-btn" title="تب جدید">＋</button>
      <div class="tab-actions">
        <button id="save-ay-btn" title="دانلود .ay">↓ .ay</button>
        <button id="load-ay-btn" title="باز کردن">↑ باز کردن</button>
        <input type="file" id="ay-file-input" accept=".ay,application/json" hidden />
      </div>
    </header>

    <div id="main">
      <aside id="toolbar">
        <div class="tool-group">
          <button class="tool-btn active" data-tool="select" title="انتخاب">
            <svg viewBox="0 0 24 24"><path d="M7 2l12 11.2-5.8.7 2.9 6.8-2.9 1.3-2.9-6.8L4 16.5z"/></svg>
          </button>
          <button class="tool-btn" data-tool="pan" title="جابه‌جایی بوم">
            <svg viewBox="0 0 24 24"><path d="M12 2L9 9H2l5.5 4L5 21l7-4.5L19 21l-2.5-8L22 9h-7z"/></svg>
          </button>
        </div>

        <div class="tool-group">
          <button class="tool-btn" data-tool="note" title="نوت">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </button>
          <button class="tool-btn" data-tool="image" title="عکس">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          </button>
          <button class="tool-btn" data-tool="table" title="جدول">
            <svg viewBox="0 0 24 24"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
          </button>
          <button class="tool-btn" data-tool="chart" title="نمودار">
            <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 4 5-7"/></svg>
          </button>
          <button class="tool-btn" data-tool="miniapp" title="مینی‌اپ HTML/CSS/JS">
            <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/><line x1="14" y1="4" x2="10" y2="20"/></svg>
          </button>
        </div>

        <div class="tool-group">
          <button class="tool-btn" data-tool="draw" title="نقاشی آزاد">
            <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-1.5"/><path d="M2 22l5-1 9-9-4-4-9 9-1 5z"/></svg>
          </button>
          <button class="tool-btn" data-tool="line" title="خط">
            <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/></svg>
          </button>
        </div>

        <div class="tool-group shapes">
          <button class="tool-btn" data-tool="rect" title="مستطیل"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/></svg></button>
          <button class="tool-btn" data-tool="circle" title="دایره"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg></button>
          <button class="tool-btn" data-tool="triangle" title="مثلث"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/></svg></button>
          <button class="tool-btn" data-tool="diamond" title="لوزی"><svg viewBox="0 0 24 24"><path d="M12 2l10 10-10 10L2 12z"/></svg></button>
          <button class="tool-btn" data-tool="hexagon" title="شش‌ضلعی"><svg viewBox="0 0 24 24"><path d="M12 2l8 4.5v9L12 20l-8-4.5v-9z"/></svg></button>
          <button class="tool-btn" data-tool="cube" title="مکعب"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg></button>
        </div>

        <div class="tool-group">
          <button class="tool-btn danger" id="delete-btn" title="حذف">
            <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
          </button>
        </div>

        <div class="color-section">
          <label>خط</label>
          <input type="color" id="stroke-color" value="#e7e9ea" />
          <label>پر</label>
          <input type="color" id="fill-color" value="#16181c" />
          <label>ضخامت</label>
          <input type="range" id="stroke-width" min="1" max="14" value="2" />
        </div>
      </aside>

      <main id="canvas-area">
        <div id="canvas-wrapper">
          <canvas id="main-canvas"></canvas>
          <div id="elements-layer"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Context Menus -->
  <div id="context-menu" class="context-menu hidden"></div>
  <div id="tab-context-menu" class="context-menu hidden"></div>

  <!-- Note Modal -->
  <div id="note-modal" class="modal hidden">
    <div class="modal-content note-modal-content glass">
      <div class="modal-header"><h3>نوت</h3><button class="close-modal">×</button></div>
      <div id="quill-editor"></div>
      <div class="modal-footer"><button id="save-note-btn" class="btn-primary">ذخیره</button></div>
    </div>
  </div>

  <!-- Chart Modal -->
  <div id="chart-modal" class="modal hidden">
    <div class="modal-content glass">
      <div class="modal-header"><h3>نمودار حرفه‌ای</h3><button class="close-modal">×</button></div>
      <div class="form-group"><label>نوع</label>
        <select id="chart-type">
          <option value="bar">میله‌ای</option>
          <option value="line">خطی</option>
          <option value="pie">دایره‌ای</option>
          <option value="doughnut">حلقه‌ای</option>
          <option value="radar">رادار</option>
          <option value="polarArea">قطبی</option>
        </select>
      </div>
      <div class="form-group"><label>عنوان</label><input type="text" id="chart-title" value="نمودار من" /></div>
      <div class="form-group"><label>برچسب‌ها (کاما)</label><input type="text" id="chart-labels" value="فروردین, اردیبهشت, خرداد, تیر" /></div>
      <div class="form-group"><label>مقادیر (کاما)</label><input type="text" id="chart-values" value="12, 19, 8, 15" /></div>
      <div class="form-group"><label>رنگ اصلی</label><input type="color" id="chart-color" value="#1d9bf0" /></div>
      <div class="modal-footer"><button id="create-chart-btn" class="btn-primary">ایجاد</button></div>
    </div>
  </div>

  <!-- Table Modal -->
  <div id="table-modal" class="modal hidden">
    <div class="modal-content glass">
      <div class="modal-header"><h3>جدول</h3><button class="close-modal">×</button></div>
      <div class="form-group"><label>سطر</label><input type="number" id="table-rows" value="4" min="1" max="30" /></div>
      <div class="form-group"><label>ستون</label><input type="number" id="table-cols" value="3" min="1" max="15" /></div>
      <div class="modal-footer"><button id="create-table-btn" class="btn-primary">ایجاد</button></div>
    </div>
  </div>

  <!-- Mini App Modal -->
  <div id="miniapp-modal" class="modal hidden">
    <div class="modal-content miniapp-modal-content glass">
      <div class="modal-header"><h3>ساخت مینی‌اپ</h3><button class="close-modal">×</button></div>
      <div class="miniapp-tabs">
        <button class="miniapp-tab active" data-panel="html">HTML</button>
        <button class="miniapp-tab" data-panel="css">CSS</button>
        <button class="miniapp-tab" data-panel="js">JS</button>
      </div>
      <div class="miniapp-panels">
        <textarea id="miniapp-html" class="code-area active" spellcheck="false" placeholder="<!-- HTML --><div class='box'>سلام دنیا</div>"></textarea>
        <textarea id="miniapp-css" class="code-area" spellcheck="false" placeholder="/* CSS */&#10;.box { color:#e7e9ea; padding:16px; font-family:sans-serif; }"></textarea>
        <textarea id="miniapp-js" class="code-area" spellcheck="false" placeholder="// JS&#10;console.log('Ayra MiniApp');"></textarea>
      </div>
      <div class="modal-footer"><button id="create-miniapp-btn" class="btn-primary">ایجاد مینی‌اپ</button></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content glass">
      <div class="modal-header"><h3 id="settings-title">تنظیمات</h3><button class="close-modal">×</button></div>
      <div id="settings-body"></div>
      <div class="modal-footer"><button id="apply-settings-btn" class="btn-primary">اعمال</button></div>
    </div>
  </div>

  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script src="app.js"></script>
</body>
  </html>
