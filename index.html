<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayra</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Quill Rich Editor -->
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Top Tab Bar -->
    <header id="tab-bar">
      <div class="brand">Ayra</div>
      <div id="tabs-container"></div>
      <button id="new-tab-btn" title="تب جدید">＋</button>
      <div class="tab-actions">
        <button id="save-ay-btn" title="ذخیره تب فعلی به صورت .ay">ذخیره .ay</button>
        <button id="load-ay-btn" title="باز کردن فایل .ay">باز کردن</button>
        <input type="file" id="ay-file-input" accept=".ay,application/json" hidden />
      </div>
    </header>

    <div id="main">
      <!-- Left Toolbar -->
      <aside id="toolbar">
        <div class="tool-group">
          <button class="tool-btn active" data-tool="select" title="انتخاب و جابه‌جایی">
            <svg viewBox="0 0 24 24"><path d="M7 2l12 11.2-5.8.7 2.9 6.8-2.9 1.3-2.9-6.8L4 16.5z"/></svg>
          </button>
          <button class="tool-btn" data-tool="pan" title="جابه‌جایی بوم">
            <svg viewBox="0 0 24 24"><path d="M12 2L9 9H2l5.5 4L5 21l7-4.5L19 21l-2.5-8L22 9h-7z"/></svg>
          </button>
        </div>

        <div class="tool-group">
          <button class="tool-btn" data-tool="note" title="نوت (ادیتور قوی)">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
          </button>
          <button class="tool-btn" data-tool="image" title="عکس">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          </button>
          <button class="tool-btn" data-tool="table" title="جدول">
            <svg viewBox="0 0 24 24"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
          </button>
          <button class="tool-btn" data-tool="chart" title="نمودار">
            <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 4 5-7"/></svg>
          </button>
        </div>

        <div class="tool-group">
          <button class="tool-btn" data-tool="draw" title="خط خطی / نقاشی آزاد">
            <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-1.5"/><path d="M2 22l5-1 9-9-4-4-9 9-1 5z"/></svg>
          </button>
          <button class="tool-btn" data-tool="line" title="خط">
            <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/></svg>
          </button>
        </div>

        <div class="tool-group shapes">
          <button class="tool-btn" data-tool="rect" title="مستطیل">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/></svg>
          </button>
          <button class="tool-btn" data-tool="circle" title="دایره">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
          </button>
          <button class="tool-btn" data-tool="triangle" title="مثلث">
            <svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/></svg>
          </button>
          <button class="tool-btn" data-tool="diamond" title="لوزی">
            <svg viewBox="0 0 24 24"><path d="M12 2l10 10-10 10L2 12z"/></svg>
          </button>
          <button class="tool-btn" data-tool="hexagon" title="شش‌ضلعی">
            <svg viewBox="0 0 24 24"><path d="M12 2l8 4.5v9L12 20l-8-4.5v-9z"/></svg>
          </button>
          <button class="tool-btn" data-tool="cube" title="مکعب">
            <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>
          </button>
        </div>

        <div class="tool-group">
          <button class="tool-btn danger" id="delete-btn" title="حذف انتخاب‌شده">
            <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
          </button>
        </div>

        <div class="color-section">
          <label>رنگ</label>
          <input type="color" id="stroke-color" value="#e8e8e8" />
          <input type="color" id="fill-color" value="#1a1a2e" />
          <label>ضخامت</label>
          <input type="range" id="stroke-width" min="1" max="12" value="2" />
        </div>
      </aside>

      <!-- Canvas Area -->
      <main id="canvas-area">
        <div id="canvas-wrapper">
          <canvas id="main-canvas"></canvas>
          <!-- Overlay for interactive elements (notes, tables, charts, images) -->
          <div id="elements-layer"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal for Note Editor -->
  <div id="note-modal" class="modal hidden">
    <div class="modal-content note-modal-content">
      <div class="modal-header">
        <h3>ویرایش نوت</h3>
        <button class="close-modal">×</button>
      </div>
      <div id="quill-editor"></div>
      <div class="modal-footer">
        <button id="save-note-btn">ذخیره نوت</button>
      </div>
    </div>
  </div>

  <!-- Modal for Chart Config -->
  <div id="chart-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>تنظیمات نمودار</h3>
        <button class="close-modal">×</button>
      </div>
      <div class="form-group">
        <label>نوع نمودار</label>
        <select id="chart-type">
          <option value="bar">میله‌ای</option>
          <option value="line">خطی</option>
          <option value="pie">دایره‌ای</option>
          <option value="doughnut">حلقه‌ای</option>
        </select>
      </div>
      <div class="form-group">
        <label>برچسب‌ها (با کاما جدا کن)</label>
        <input type="text" id="chart-labels" value="A, B, C, D" />
      </div>
      <div class="form-group">
        <label>مقادیر (با کاما جدا کن)</label>
        <input type="text" id="chart-values" value="12, 19, 8, 15" />
      </div>
      <div class="modal-footer">
        <button id="create-chart-btn">ایجاد نمودار</button>
      </div>
    </div>
  </div>

  <!-- Modal for Table -->
  <div id="table-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>ایجاد جدول</h3>
        <button class="close-modal">×</button>
      </div>
      <div class="form-group">
        <label>تعداد سطر</label>
        <input type="number" id="table-rows" value="3" min="1" max="20" />
      </div>
      <div class="form-group">
        <label>تعداد ستون</label>
        <input type="number" id="table-cols" value="3" min="1" max="12" />
      </div>
      <div class="modal-footer">
        <button id="create-table-btn">ایجاد جدول</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
